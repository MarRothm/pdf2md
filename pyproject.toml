[project]
name = "pdf2md"
dynamic = ["version"]
description = "Offline PDF-to-Markdown web service in front of a docling-serve engine"
requires-python = ">=3.12"
# Bounded, because the image is the deliverable. The engine is pinned by tag *and*
# digest and the stack refuses a moving tag (FR-032) — and then this floated every
# library inside our own image, so two builds of the same commit produced different
# software. `pypdf>=5.1` spanned two major versions; the 1.9.0 image was the first
# built after pypdf 6.16.2 was released and it refused a document that 6.16.1, in
# every earlier image and in CI, had read without complaint.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.12,<0.1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Exact. This one reads every uploaded document before anything else happens, so a
    # stricter release rejects files at the door and the operator sees only "damaged" —
    # which is what 6.16.2 did, with a new page-tree depth limit of 100 against a contract
    # collection nested 101 deep (see `pdfinfo.PAGE_TREE_MAX_DEPTH`). Move it deliberately,
    # and only against a document that is known to convert.
    "pypdf==6.16.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pdf2md/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI dependency defaults are function calls by design

[tool.ruff.lint.isort]
known-first-party = ["pdf2md", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "contract: contract tests against a documented interface",
    "integration: end-to-end flows against the stub engine",
    "unit: isolated unit tests",
]
