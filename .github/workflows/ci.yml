# Runs on every push and pull request. Nothing here publishes anything — the image is
# built and pushed only by publish.yml, and only on a `v*` tag (research.md R10).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest
