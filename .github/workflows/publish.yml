# Builds the web image and publishes it to GHCR. Triggered only by a `v*` tag, never by
# an ordinary commit: the deployed version changes when someone decides it should, not
# when someone merges (FR-032, research.md R10).
#
# The runner is `ubuntu-24.04-arm` — a native arm64 build for an arm64-only target, free
# for public repositories. Those runner labels do not work in private repositories, so
# this workflow and the public-repository requirement (FR-031) stand or fall together.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The owner is `MarRothm`, but OCI repository names must be lowercase — passing
      # `github.repository_owner` through unchanged makes the reference invalid and the
      # push fails before it builds anything.
      - name: Derive the version and the image reference
        id: image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${owner}/pdf2md-web" >> "$GITHUB_OUTPUT"

      # build-push-action needs a buildx builder that can export a real image manifest;
      # the default docker driver refuses the `platforms:` input.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest` tag. The stack pins by digest, and a moving tag is exactly what
      # FR-032 rules out.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          provenance: false

      # The digest is what goes into deploy/docker-compose.yml. Printing it in the job
      # summary means the operator does not have to go looking for it.
      - name: Record the digest for the stack file
        run: |
          image="${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          {
            echo "### Pin this in \`deploy/docker-compose.yml\`"
            echo
            echo '```'
            echo "${image}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Then verify it pulls with no credential:"
            echo
            echo '```'
            echo "docker logout ghcr.io && docker pull ${image}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
